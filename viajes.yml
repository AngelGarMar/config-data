spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://viajesbd:3306/viajes
    username: root
    password: travels
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
server:
  port: 8085
#Actuator
app:
  maintenance:
    createViaje: true
management:
  endpoints:
    web:
      exposure:
        include: "refresh, health, info"
#Eureka
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
      defaultZone: ${eureka.client.service-url.defaultZone}