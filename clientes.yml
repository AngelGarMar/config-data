spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://clientesbd:3306/clientes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: clients
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
#Actuator
app:
  maintenance:
    createClient: true
  upload:
    dir: ${image.upload.dir:/opt/uploads/} # linux: /opt/uploads/ ; windows: D:/TransporteMicroservicios/Version3/Imagenes/
management:
  endpoints:
    web:
      exposure:
        include: "refresh, health, info"
#Eureka
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
      defaultZone: ${eureka.client.service-url.defaultZone}