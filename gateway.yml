spring:
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: clientes-delete
              uri: lb://CLIENTES
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/clients/{id}
                - name: Method
                  args:
                    methods:
                      - DELETE
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "admin"
            - id: clientes-getall
              uri: lb://CLIENTES
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/clients
                - name: Method
                  args:
                    methods:
                      - GET
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "admin"
            - id: clientes
              uri: lb://CLIENTES
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/clients/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "user,admin"
            - id: conductores-get
              uri: lb://CONDUCTORES
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/drivers/{id}
                - name: Method
                  args:
                    methods:
                      - GET
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "user,admin"
            - id: conductores-getvehicle
              uri: lb://CONDUCTORES
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/vehicles/{id}
                - name: Method
                  args:
                    methods:
                      - GET
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "user,admin"
            - id: conductores
              uri: lb://CONDUCTORES
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/drivers/**
                      - /api/v1/data/**
                      - /api/v1/vehicles/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "admin"
            - id: pagos
              uri: lb://PAGOS
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/pagos/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "user,admin"
            - id: paraderos
              uri: lb://PARADEROS
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/paraderos/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "user,admin"
            - id: usuarios-login
              uri: lb://USUARIOS
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/users/login
              filters:
                - StripPrefix=2
            - id: usuarios-actuator
              uri: lb://USUARIOS
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/USUARIOS/actuator/**
              filters:
                - name: AuthenticationFilter
                  args:
                    requiredRole: "admin"
                - StripPrefix=3
            - id: usuarios
              uri: lb://USUARIOS
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/users/**
                      - /api/v1/roles/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "admin"
            - id: viajes
              uri: lb://VIAJES
              predicates:
                - name: Path
                  args:
                    patterns:
                      - /api/v1/viajes/**
              filters:
                - StripPrefix=2
                - name: AuthenticationFilter
                  args:
                    requiredRole: "user,admin"
server:
  port: 9000
#Eureka
eureka:
  client:
    service-url:
      defaultZone: ${eureka.client.service-url.defaultZone}
    fetch-registry: true
    register-with-eureka: true
#Actuator
app:
  maintenance:
    secret-key: ${secret.key}